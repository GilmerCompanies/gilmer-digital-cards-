<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808"><title>{{EMPLOYEE_NAME}} | Gilmer</title>
<link rel="stylesheet" href="../assets/styles.css"></head>
<body><div class="page"><main class="card">
<section class="header">
<img class="logo" src="../assets/gilmer-logo.jpg" alt="Gilmer">
<div class="headshot-wrap"><img class="headshot" src="{{PHOTO_FILENAME}}" alt="{{EMPLOYEE_NAME}}"></div>
</section>
<section class="content">
<h1 class="name">{{EMPLOYEE_NAME}}</h1><div class="title-rule"></div>
<p class="title">{{JOB_TITLE}}</p>
<div class="contact-list">
<a class="contact-row" href="tel:{{PHONE_TEL}}"><span class="contact-icon">☎</span><span class="contact-text">{{PHONE_DISPLAY}}</span></a>
<a class="contact-row" href="mailto:{{EMAIL}}"><span class="contact-icon">✉</span><span class="contact-text">{{EMAIL}}</span></a>
<a class="contact-row" href="https://www.gilmer1.com" target="_blank"><span class="contact-icon">◎</span><span class="contact-text">www.gilmer1.com</span></a>
<a class="contact-row" href="https://www.linkedin.com/in/{{LINKEDIN_SLUG}}" target="_blank"><span class="contact-icon">in</span><span class="contact-text">linkedin.com/in/{{LINKEDIN_SLUG}}</span></a>
</div>
<div class="actions">
<a class="btn primary" href="tel:{{PHONE_TEL}}">CALL</a>
<a class="btn secondary" href="mailto:{{EMAIL}}">EMAIL</a>
<a class="btn outline" href="https://www.gilmer1.com" target="_blank">VISIT WEBSITE</a>
<a class="btn outline" href="https://www.linkedin.com/in/{{LINKEDIN_SLUG}}" target="_blank">VIEW LINKEDIN</a>
<a class="btn primary" href="{{VCF_FILENAME}}">ADD TO CONTACTS</a>
</div></section>
<section class="qr-section">
<div class="qr-box"><img src="qr.png" alt="QR code for {{EMPLOYEE_NAME}}"></div>
<div class="qr-copy"><div class="script">Scan to Save</div><div class="small">MY CONTACT</div></div>
</section>
<footer class="footer"><strong>GILMER</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Family Owned. Professionally Managed. Performance Driven.</footer>
</main></div></body></html>
